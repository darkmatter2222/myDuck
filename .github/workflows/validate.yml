name: Validate launcher and controller
on: [push, pull_request, workflow_dispatch]
jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/xgoduck_engine.py
      - run: bash -n scripts/bootstrap.sh
  tensorboard-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - name: Verify real isolated TensorBoard installation
        run: uv tool run --python 3.12 --with setuptools==80.9.0 --from tensorboard==2.20.0 tensorboard --version
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'XgoDuck.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Test actual child process argument passing
        shell: powershell
        run: .\tests\test_windows_launcher.ps1
      - name: Construct desktop and check layout
        shell: powershell
        run: powershell.exe -NoProfile -STA -File .\XgoDuck.Desktop.ps1 -SelfTest
      - name: Verify CMD entry point saves startup output
        shell: powershell
        run: |
          cmd.exe /c START-XGODUCK.cmd -SelfTest
          $deadline=(Get-Date).AddSeconds(30)
          $ok=$false
          do {
            Start-Sleep -Milliseconds 500
            if (Test-Path 'launcher-logs/desktop-startup.log') {
              $ok=(Get-Content 'launcher-logs/desktop-startup.log' -Raw) -match 'Desktop construction and layout checks passed'
            }
          } until ($ok -or (Get-Date) -gt $deadline)
          if (-not $ok) {throw 'CMD launcher did not complete its desktop self-test'}
      - name: Exercise full launcher success and failure paths with WSL fixture
        shell: powershell
        run: .\tests\test_windows_workflow.ps1
