name: Validate Linux web studio
on: [push, pull_request, workflow_dispatch]
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q studio scripts
      - run: bash -n start.sh scripts/bootstrap.sh
      - run: node --check web/app.js
      - name: Start actual app and verify health, UI and protected API
        run: |
          ./start.sh --port 18765 --state-dir /tmp/myduck-ci > /tmp/myduck-start.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail -s http://localhost:18765/health > /tmp/health.json; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json,re,urllib.request
          root='http://localhost:18765'
          assert json.load(urllib.request.urlopen(root+'/health'))['app']=='myduck-studio'
          html=urllib.request.urlopen(root).read().decode()
          assert 'Checkpoint tree' in html
          token=re.search(r'name="studio-token" content="([^"]+)"',html)[1]
          request=urllib.request.Request(root+'/api/state',headers={'X-Studio-Token':token})
          state=json.load(urllib.request.urlopen(request))
          assert state['models']==[]
          assert not state['services']['viewer']['ready']
          print('Actual web server and empty-state checks passed')
          PY
  tensorboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv tool run --python 3.12 --with setuptools==80.9.0 --from tensorboard==2.20.0 tensorboard --version
      - run: uv run --no-project --python 3.12 --with tensorboard==2.20.0 --with setuptools==80.9.0 python tests/check_scalar_events.py
